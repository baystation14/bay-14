- type: entity
  parent: ClothingHandsBase
  id: ClothingHandGlovesFleet
  name: fleet duty gloves
  description: These black duty gloves are made from durable synthetic materials. Standard issue to all ranks in the SCG Fleet.
  components:
  - type: Sprite
    sprite: _Bay14/Clothing/Hands/Gloves/fleetgloves.rsi
  - type: Clothing
    sprite: _Bay14/Clothing/Hands/Gloves/fleetgloves.rsi
  - type: Fiber
    fiberMaterial: fibers-classified
    fiberColor: fibers-pitch-black

