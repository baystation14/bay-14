# Ushankas

- type: entity
  parent: [ ClothingHeadBase, BaseFoldable ]
  id: ClothingHeadHatUshankaNavy
  name: fleet fur hat
  description: An SCG Fleet synthfur-lined hat for operating in cold environments.
  components:
  - type: Clothing
    sprite: _Bay14/Clothing/Head/Hats/fleet_ushanka.rsi
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
  - type: FoldableClothing
    foldedEquippedPrefix: up
    foldedHeldPrefix: up
  - type: Sprite
    sprite: _Bay14/Clothing/Head/Hats/fleet_ushanka.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-up
      map: ["foldedLayer"]
      visible: false

- type: entity
  parent: [ ClothingHeadBase, BaseFoldable ]
  id: ClothingHeadHatUshankaExpeditionary
  name: expeditionary fur hat
