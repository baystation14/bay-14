    sprite: _Bay14/Clothing/Head/Hats/expedition_ushanka.rsi
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
  - type: FoldableClothing
    foldedEquippedPrefix: up
    foldedHeldPrefix: up
  - type: Sprite
    sprite: _Bay14/Clothing/Head/Hats/expedition_ushanka.rsi
    layers:
    - state: icon
