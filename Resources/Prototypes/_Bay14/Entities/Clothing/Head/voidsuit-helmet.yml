- type: entity
  parent: ClothingHeadHardsuitWithLightBase
  id: ClothingHeadHelmetHardsuitExplorer
  name: explorer hardsuit helmet
  components:
  - type: BreathMask
  - type: Sprite
    sprite: _Bay14/Clothing/Head/Hardsuits/explorer.rsi
  - type: Clothing
    sprite: _Bay14/Clothing/Head/Hardsuits/explorer.rsi
  - type: PointLight
    color: "#add8e6"
    rotation: 30
    energy: 10
    radius: 5
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 1000
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.1
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
        Radiation: 0.8
        Caustic: 0.8

