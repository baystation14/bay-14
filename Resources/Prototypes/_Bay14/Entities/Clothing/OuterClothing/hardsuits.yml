- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitExplorer
  name: explorer hardsuit
  description: Standard-issue hardsuit for explorers.
  components:
  - type: Sprite
    sprite: _Bay14/Clothing/OuterClothing/Hardsuits/explorer.rsi
  - type: Clothing
    sprite: _Bay14/Clothing/OuterClothing/Hardsuits/explorer.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.8
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.1
      OrganDamage: 0.1
      BoneDamage: 0.1
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.85
        Heat: 0.8
        Radiation: 0.7
        Caustic: 0.8
  - type: ClothingSpeedModifier
    sprintModifier: 0.8
    walkModifier: 0.8
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitExplorer
  - type: ModifyDelayedKnockdown
    delayDelta: 1
    knockdownTimeDelta: -0.5
  - type: StaminaResistance
    damageCoefficient: 0.9

