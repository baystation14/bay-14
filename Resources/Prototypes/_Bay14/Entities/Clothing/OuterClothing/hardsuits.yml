- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitExplorer
  name: explorer hardsuit
  description: Standard-issue hardsuit for explorers.
  components:
  - type: Sprite
    sprite: _Bay14/Clothing/OuterClothing/Hardsuits/explorer.rsi
  - type: Clothing
    sprite: _Bay14/Clothing/OuterClothing/Hardsuits/explorer.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.65
        Heat: 0.65
        Radiation: 0.6
        Caustic: 0.6
  - type: ClothingSpeedModifier
    sprintModifier: 0.9
    walkModifier: 0.9
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitExplorer
  - type: ModifyDelayedKnockdown # Goobstation
    delayDelta: 2
    knockdownTimeDelta: -2
  - type: StaminaResistance
    damageCoefficient: 0.6
