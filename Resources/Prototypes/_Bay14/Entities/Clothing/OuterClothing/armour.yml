- type: entity
  parent: ClothingOuterArmorBase
  id: ClothingOuterArmorNavy
  name: navy plate carrier
  description: Barebones plate carrier, without any additional bags.
  components:
  - type: Sprite
    sprite: _Bay14/Clothing/OuterClothing/Armor/carrier.rsi
  - type: Clothing
    sprite: _Bay14/Clothing/OuterClothing/Armor/carrier.rsi
  - type: Armor
    coverage:
    - Chest
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.75
        Piercing: 0.9

- type: entity
  parent: [ClothingOuterArmorNavy, ClothingOuterStorageBase]
  id: ClothingOuterArmorNavyVestWeb
  name: navy web vest
  description: A bit more advanced than plate carrier, just cause there's now some pockets, for god's sake!
  components:
  - type: Sprite
    sprite: _Bay14/Clothing/OuterClothing/Armor/navyweb.rsi
  - type: Clothing
    sprite: _Bay14/Clothing/OuterClothing/Armor/navyweb.rsi

- type: entity
  parent: ClothingOuterArmorNavyVestWeb
  id: ClothingOuterArmorSecVestWeb
  name: security web vest
  description: Perhaps I've seen this same design somewhere...
  components:
  - type: Sprite
    sprite: _Bay14/Clothing/OuterClothing/Armor/secweb.rsi
  - type: Clothing
    sprite: _Bay14/Clothing/OuterClothing/Armor/secweb.rsi
