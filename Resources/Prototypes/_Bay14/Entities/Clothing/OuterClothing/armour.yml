- type: entity
  parent: ClothingOuterArmorBase
  id: ClothingOuterArmorNavy
  name: Sol Central Government armored vest
  description: A synthetic armor vest. This one is marked with the crest of the Sol Central Government.
  components:
  - type: Sprite
    sprite: _Bay14/Clothing/OuterClothing/Armor/carrier.rsi
  - type: Clothing
    sprite: _Bay14/Clothing/OuterClothing/Armor/carrier.rsi
  - type: Armor
    coverage:
    - Chest
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.75
        Piercing: 0.9

- type: entity
  parent: [ClothingOuterArmorBase, ClothingOuterStorageBase]
  id: ClothingOuterArmorNavyVestWeb
  name: Sol Central Government heavy armored vest
  description: A synthetic armor vest with PEACEKEEPER printed in distinctive blue lettering on the chest. This one has added webbing and ballistic plates.
  components:
  - type: Sprite
    sprite: _Bay14/Clothing/OuterClothing/Armor/navyweb.rsi
  - type: Clothing
    sprite: _Bay14/Clothing/OuterClothing/Armor/navyweb.rsi
  - type: Armor
    coverage:
    - Chest
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.65
        Piercing: 0.85

- type: entity
  parent: ClothingOuterArmorNavyVestWeb
  id: ClothingOuterArmorSecVestWeb
  name: master at arms heavy armored vest
  description: A synthetic armor vest with MASTER AT ARMS printed in silver lettering on the chest. This one has added webbing and ballistic plates.
  components:
  - type: Sprite
    sprite: _Bay14/Clothing/OuterClothing/Armor/secweb.rsi
  - type: Clothing
    sprite: _Bay14/Clothing/OuterClothing/Armor/secweb.rsi
