- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformNavyCombat
  name: fleet fatigues
  description: Alternative utility uniform of the SCG Fleet, for when coveralls are impractical.
  components:
  - type: Sprite
    sprite: _Bay14/Clothing/Uniforms/Jumpsuit/navycombat.rsi
  - type: Clothing
    sprite: _Bay14/Clothing/Uniforms/Jumpsuit/navycombat.rsi
    equippedState: navycombat
    femaleMask: Female
  # Bay14 - keep the sensors on by default
  - type: SuitSensor
    controlsLocked: false
    randomMode: false
    mode: SensorCords

