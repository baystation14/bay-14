- type: entity
  parent: [ ClothingModsuitStandardNoStorage, BaseCommandContraband ]
  id: ClothingModsuitExplorer
  name: explorer control unit
  description: The main controller for the "Explorer" modsuit, made for exploration team leaders.
  components:
    - type: Sprite
      sprite: _Bay14/Clothing/OuterClothing/Modsuits/explorer.rsi
    - type: ToggleableClothing
      clothingPrototypes:
        head: ClothingModsuitHelmetExplorer
        gloves: ClothingModsuitGauntletsExplorer
        outerClothing: ClothingModsuitChestplateExplorer
        shoes: ClothingModsuitBootsExplorer
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellAntiqueProto
          whitelist:
            components:
              - PowerCell
    - type: ChameleonClothing
      slot: [back]
      default: ClothingModsuitExplorer
    - type: UserInterface
      interfaces:
        enum.ChameleonUiKey.Key:
          type: ChameleonBoundUserInterface
        enum.ToggleClothingUiKey.Key:
          type: ToggleableClothingBoundUserInterface
    - type: ExplosionResistance
      damageCoefficient: 0.1

- type: entity
  parent: [ ClothingModsuitGauntletsStandard, BaseCommandContraband ]
  id: ClothingModsuitGauntletsExplorer
  name: CO's modsuit gauntlets
  description: A pair of gauntlets made for the CO's modsuit.
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Bay14/Clothing/OuterClothing/Modsuits/explorer.rsi
    - type: SealableClothingVisuals
      spriteLayer: sealed
      clothingVisuals:
        gloves:
        - state: equipped-HAND-sealed
    - type: ComponentToggler
      components:
      - type: Insulated
      - type: GrabModifier
        grabEscapeModifier: -0.1
        grabEscapeMultiplier: 0.8
        grabMoveSpeedMultiplier: 2
        startingGrabStage: Hard

- type: entity
  parent: [ ClothingModsuitHelmetStandard, ShowSecurityIcons, BaseCommandContraband ]
  id: ClothingModsuitHelmetExplorer
  name: CO's modsuit helmet
  description: A state-of-the-art helmet designed by SolGov's finest researchers for the CO's modsuit. It also includes a built-in HUD.
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Bay14/Clothing/OuterClothing/Modsuits/explorer.rsi
    - type: Armor
      traumaDeductions:
        Dismemberment: 0.3
        OrganDamage: 0.3
        BoneDamage: 0.3
        VeinsDamage: 0
        NerveDamage: 0
      modifiers:
        coefficients:
          Blunt: 0.55
          Slash: 0.55
          Piercing: 0.5
          Heat: 0.55
          Caustic: 0.5
          Radiation: 0.0
    - type: FireProtection
      reduction: 0.2
    - type: FlashImmunity
    - type: FlashSoundSuppression
      protectionRange: 0
    - type: ShowHealthBars
      damageContainers:
        - Biological
    - type: SealableClothingVisuals
      spriteLayer: sealed
      clothingVisuals:
        head:
        - state: equipped-HEAD-sealed
    - type: ActivatableUI
      inHandsOnly: false
      singleUser: true
      requireActiveHand: false
      verbText: verb-instrument-openui
      key: enum.InstrumentUiKey.Key
    - type: UserInterface
      interfaces:
        enum.InstrumentUiKey.Key:
          type: InstrumentBoundUserInterface
    - type: HideLayerClothing
      slots:
      - Hair
      - Snout
      - HeadTop
      - HeadSide
    - type: ClothingGrantComponent
      component:
      - type: IntrinsicUI
        uis:
          enum.RadarConsoleUiKey.Key:
            toggleAction: ActionGhostShowRadar
      - type: RadarConsole
        followEntity: true
    - type: ComponentToggler
      components:
      - type: EyeProtection
      - type: BreathMask
      - type: PressureProtection
        highPressureMultiplier: 0.3
        lowPressureMultiplier: 1000
      - type: TemperatureProtection
        heatingCoefficient: 0.01
        coolingCoefficient: 0.01
      - type: IdentityBlocker
      - type: IngestionBlocker
        blockSmokeIngestion: True

- type: entity
  parent: [ ClothingModsuitChestplateStandard, BaseCommandContraband ]
  id: ClothingModsuitChestplateExplorer
  name: CO's modsuit chestplate
  description: A state of the art chestplate designed by the brightest SolGov's scientists for the CO's modsuit.
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Bay14/Clothing/OuterClothing/Modsuits/explorer.rsi
    - type: ClothingSpeedModifier
      walkModifier: 1
      sprintModifier: 1
    - type: Armor
      traumaDeductions:
        Dismemberment: 0.3
        OrganDamage: 0.3
        BoneDamage: 0.3
        VeinsDamage: 0
        NerveDamage: 0
      modifiers:
        coefficients:
          Blunt: 0.5
          Slash: 0.5
          Piercing: 0.45
          Heat: 0.5
          Caustic: 0.5
          Radiation: 0
    - type: ExplosionResistance
      damageCoefficient: 0.4
    - type: StaminaResistance
      damageCoefficient: 0.7
    - type: FireProtection
      reduction: 0.8
    - type: SealableClothingVisuals
      spriteLayer: sealed
      clothingVisuals:
        outerClothing:
        - state: equipped-OUTERCLOTHING-sealed
    - type: ComponentToggler
      components:
      - type: ClothingAutoInject
        reagents:
          Epinephrine: 10
          Bicaridine: 10
          TranexamicAcid: 5
          Tramadol: 5
      - type: PressureProtection
        highPressureMultiplier: 0.3
        lowPressureMultiplier: 1000
      - type: TemperatureProtection
        coolingCoefficient: 0.01
        heatingCoefficient: 0.01

- type: entity
  parent: [ ClothingModsuitBootsStandard, BaseCommandContraband ]
  id: ClothingModsuitBootsExplorer
  name: CO's modsuit boots
  description: A state-of-the-art pair of magboots for the CO's modsuit. So long as the suit is powered, these will not slow the wearer down.
  categories: [ HideSpawnMenu ]
  components:
    - type: Appearance
    - type: Sprite
      sprite: _Bay14/Clothing/OuterClothing/Modsuits/explorer.rsi
    - type: Tag
      tags:
        - WhitelistChameleon
    - type: SealableClothingVisuals
      spriteLayer: sealed
      clothingVisuals:
        shoes:
        - state: equipped-FEET-sealed
    - type: ItemToggle
    - type: ToggleClothing
      action: ActionToggleMagboots
    - type: ComponentToggler
      components:
      - type: NoSlip
    - type: ModifyStandingUpTime
      multiplier: 0.5
    - type: Magboots
      enabledPrefix: null
    - type: ClothingSpeedModifier
      walkModifier: 1.1
      sprintModifier: 1.1
